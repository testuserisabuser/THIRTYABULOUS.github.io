<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#210b1b">
  <meta name="description" content="Интерактивный журнальный выпуск-приглашение на день рождения 12 декабря 2026 года в Калуге.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="30 & Fabulous — интерактивное приглашение">
  <meta property="og:description" content="Листай журнал-приглашение: день рождения, программа, дата и ответ на приглашение.">
  <meta property="og:image" content="girls-party.webp">
  <title>30 & Fabulous — интерактивное приглашение</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23ec4d9b'/%3E%3Ctext x='50' y='67' font-size='46' text-anchor='middle' font-family='Georgia' fill='white'%3E30%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="magazine-open">
  <main class="magazine-modal magazine-app" id="magazineModal">
    <div class="magazine-backdrop" aria-hidden="true"></div>
    <section class="magazine-dialog" aria-labelledby="magazineDialogTitle" aria-describedby="magazineDialogHint">
      <header class="magazine-toolbar">
        <div class="magazine-brand"><span class="magazine-brand-mark">30</span><span><strong id="magazineDialogTitle">THE BIRTHDAY ISSUE</strong><small>VOL. 30 · DECEMBER 2026</small></span></div>
        <button class="magazine-close" id="magazineHome" type="button" aria-label="Вернуться на обложку"><span aria-hidden="true">↶</span><small>Обложка</small></button>
      </header>
      <div class="magazine-stage">
        <div class="magazine-book" id="magazineBook" aria-live="polite" aria-atomic="true">
          <article class="magazine-page magazine-page-left" id="magazineLeft" aria-label="Левая страница"></article>
          <article class="magazine-page magazine-page-right" id="magazineRight" aria-label="Текущая страница"></article>
        </div>
        <div class="magazine-edge-note" aria-hidden="true">30 &amp; FABULOUS <span>✳</span></div>
      </div>
      <div class="magazine-controls">
        <button class="magazine-control magazine-prev" id="magazinePrev" type="button" disabled><span class="control-arrow" aria-hidden="true">←</span><span class="control-copy"><small>НАЗАД</small><strong>Назад</strong></span></button>
        <div class="magazine-pagination">
          <div class="magazine-page-count"><strong id="magazinePageCurrent">01</strong><span>/</span><span id="magazinePageTotal">06</span></div>
          <div class="magazine-progress" aria-hidden="true"><span id="magazineProgressFill"></span></div>
          <div class="magazine-dots" id="magazineDots" aria-label="Перейти к странице"></div>
        </div>
        <button class="magazine-control magazine-next" id="magazineNext" type="button"><span class="control-copy"><small>СЛЕДУЮЩАЯ</small><strong>Далее</strong></span><span class="control-arrow" aria-hidden="true">→</span></button>
      </div>
      <p class="magazine-hint" id="magazineDialogHint"><span>↔</span> Листай кнопками, стрелками клавиатуры или свайпом</p>
      <p class="magazine-toast" id="magazineToast" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
